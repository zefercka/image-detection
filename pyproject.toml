[project]
name = "image-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "aiofile>=3.9.0",
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "audio-extract>=0.7.0",
    "demucs>=4.0.0",
    "datasets>=2.19.1",
    "dotenv>=0.9.9",
    "dramatiq>=2.1.0",
    "einops>=0.8.2",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "kaggle>=2.1.0",
    "libmagic>=1.0",
    "numpy>=2.4.3",
    "openai-whisper>=20250625",
    "easyocr>=1.7.2",
    "opencv-python>=4.10.0",
    "pika>=1.3.2",
    "pillow>=12.1.1",
    "python-magic-bin>=0.4.14",
    "sentencepiece>=0.2.1",
    "snowflake-id>=1.0.2",
    "supervision>=0.28.0",
    "timm>=1.0.27",
    "transformers>=4.41.0,<5.0.0",
    "ultralytics>=8.4.45",
    "yt-dlp>=2026.3.17",
    "ffpyplayer>=4.3.5",
    "soundfile>=0.13.1",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu124"]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4

target-version = "py313"

[tool.ruff.lint]
select = [
    "FAST", "YTT", "ANN", "ASYNC", "S", "BLE", "B", "A", "COM", "C4",
    "DTZ", "T10", "EM", "FIX", "INT", "ISC", "ICN", "LOG", "G", "PIE", "T20",
    "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "SLOT", "TID", "TD", "TC",
    "ARG", "PTH", "FLY", "I", "C90", "N", "PERF", "E", "W", "DOC", "D", "F",
    "PL", "UP", "FURB", "RUF", "TRY"
]
ignore = ["D100", "D102", "D104", "D106", "D107", "D202", "G004", "RUF001"]
exclude = ["migrations", "venv", ".venv", "build", "dist", "__pycache__"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ty.environment]
root = ["./destructive-content-detection"]
